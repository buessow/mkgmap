# mkgmap options for the Swiss topo map built from swiss-map-vector25.
gmapsupp
# .gmap bundle for BaseCamp on the Mac (install into ~/Library/Application Support/Garmin/Maps)
gmapi
tdbfile
route
index
max-jobs=3
merge-lines
allow-reverse-merge
add-pois-to-areas
code-page=1252
# Mixed-case labels; without this mkgmap upper-cases every name.
lower-case
location-autofill=is_in,nearest
order-by-decreasing-area
improve-overview
remove-ovm-work-files

product-id=1
family-id=30005
family-name=Outabout_swiss_topo
country-name=Switzerland
country-abbr=CHE
